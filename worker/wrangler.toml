name = "void-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

# Cloudflare Workers AI binding — free, no key needed, always works
[ai]
binding = "AI"

# ─── SECRETS (set these in Cloudflare Dashboard, never in this file) ──────────
#
# Dashboard → Workers → void-proxy → Settings → Variables → Add variable (Secret)
#
#   GROQ_KEY       →  https://console.groq.com          (free account, 1 min)
#   OPENROUTER_KEY →  https://openrouter.ai              (free account, 1 min)
#
# Both are optional — the Worker still works without them (falls back to
# Cloudflare Workers AI + Pollinations). But adding both keys unlocks
# Llama 3.3 70B (the best free model) across two separate rate limit pools.
# ──────────────────────────────────────────────────────────────────────────────
