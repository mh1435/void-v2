name = "void-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

# ── Pro subscriptions: KV namespace to remember who paid ──────────────────────
# Create it once:  npx wrangler kv namespace create PLANS
# then paste the printed id below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "PLANS"
id = "REPLACE_WITH_KV_ID"

# Plain var (not secret):
[vars]
APP_URL = "https://void-v2-1.onrender.com"

# ── Payment secrets (add as "Secret" in Cloudflare dashboard) ─────────────────
#   STRIPE_SECRET_KEY        sk_live_…        dashboard.stripe.com  (worldwide cards)
#   STRIPE_WEBHOOK_SECRET    whsec_…          Stripe → Webhooks
#   STRIPE_PRICE_PRO         price_…          Stripe → Products (Pro, recurring)
#   STRIPE_PRICE_MAX         price_…          Stripe → Products (Max, recurring)
#   XENDIT_SECRET_KEY        xnd_…            dashboard.xendit.co   (TNG / GrabPay / FPX)
#   XENDIT_CALLBACK_TOKEN    …                Xendit → Settings → Callbacks

# ── Add these as Secrets in Cloudflare Dashboard ──────────────────────────────
# Workers → void-proxy → Settings → Variables → Add variable → select "Secret"
#
#   GROQ_KEY        free at  console.groq.com
#   CEREBRAS_KEY    free at  cloud.cerebras.ai       (fastest: 1000+ tok/s)
#   SAMBANOVA_KEY   free at  cloud.sambanova.ai
#   DEEPSEEK_KEY    free at  platform.deepseek.com
#   OPENROUTER_KEY  free at  openrouter.ai/keys
#   TOGETHER_KEY    free at  api.together.ai
#   FIREWORKS_KEY   free at  fireworks.ai
#   NVIDIA_KEY      free at  build.nvidia.com
#   HYPERBOLIC_KEY  free at  app.hyperbolic.xyz
#   HF_TOKEN        free at  huggingface.co/settings/tokens
#   MISTRAL_KEY     free at  console.mistral.ai
#   COHERE_KEY      free at  dashboard.cohere.com
#   GEMINI_KEY      free at  aistudio.google.com/apikey
#
# Add as many or as few as you have. The Worker skips any that aren't set.
# Keys are encrypted — only you can see them in Cloudflare. Users see nothing.
# ──────────────────────────────────────────────────────────────────────────────
