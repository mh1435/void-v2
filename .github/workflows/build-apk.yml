name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets and sync to Android
        run: |
          mkdir -p www
          cp index.html style.css app.js gamehub-data.js manifest.json sw.js icon-192.png icon-512.png www/
          cp -r images www/
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk VOID-latest.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOID-APK
          path: VOID-latest.apk
          retention-days: 90

      - name: Delete previous latest release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VOID — Latest Build"
          body: |
            ## VOID Android App

            **Tap `VOID-latest.apk` below to download and install.**

            ### Install steps
            1. Download `VOID-latest.apk`
            2. On your phone: **Settings → Security → Install unknown apps** (enable for your browser or files app)
            3. Open the downloaded file → Install
          files: VOID-latest.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
