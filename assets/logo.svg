<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- VOID — event-horizon mark: a tilted accretion ring orbiting a black core -->
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%"  stop-color="#8ff0ff"/>
      <stop offset="28%" stop-color="#b18cff"/>
      <stop offset="62%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#4632c8"/>
    </linearGradient>
    <linearGradient id="ringGradBack" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%"  stop-color="#5fb6d9"/>
      <stop offset="40%" stop-color="#7a63d6"/>
      <stop offset="100%" stop-color="#372a99"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000"/>
      <stop offset="74%" stop-color="#02020a"/>
      <stop offset="92%" stop-color="#171034"/>
      <stop offset="100%" stop-color="#2c1e63"/>
    </radialGradient>
    <radialGradient id="nebula" cx="32%" cy="26%" r="80%">
      <stop offset="0%"  stop-color="#241a55" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#140f33" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#7c6fff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7c6fff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7c6fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glowMid" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowSoft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- deep-space tile -->
  <rect width="512" height="512" rx="104" fill="#06060d"/>
  <rect width="512" height="512" rx="104" fill="url(#nebula)"/>

  <!-- faint starfield -->
  <g fill="#ffffff">
    <circle cx="92"  cy="98"  r="1.8" opacity="0.55"/>
    <circle cx="150" cy="64"  r="1.2" opacity="0.35"/>
    <circle cx="418" cy="88"  r="1.5" opacity="0.45"/>
    <circle cx="452" cy="150" r="1.1" opacity="0.3"/>
    <circle cx="70"  cy="330" r="1.3" opacity="0.35"/>
    <circle cx="118" cy="428" r="1.6" opacity="0.4"/>
    <circle cx="398" cy="418" r="1.9" opacity="0.5"/>
    <circle cx="356" cy="60"  r="1.0" opacity="0.3"/>
    <circle cx="446" cy="356" r="1.2" opacity="0.32"/>
    <circle cx="58"  cy="196" r="1.0" opacity="0.28"/>
  </g>

  <!-- ambient halo behind the whole system -->
  <circle cx="256" cy="256" r="205" fill="url(#halo)" filter="url(#glowBig)"/>

  <!-- everything orbital lives in one tilted frame -->
  <g transform="rotate(-24 256 256)">
    <clipPath id="topHalf"><rect x="-40" y="-40" width="592" height="296"/></clipPath>
    <clipPath id="bottomHalf"><rect x="-40" y="256" width="592" height="296"/></clipPath>

    <!-- back of the ring: passes BEHIND the core (dimmer, cooler) -->
    <g clip-path="url(#topHalf)">
      <ellipse cx="256" cy="256" rx="176" ry="62" fill="none" stroke="url(#ringGradBack)" stroke-width="26" opacity="0.85"/>
      <ellipse cx="256" cy="256" rx="176" ry="62" fill="none" stroke="#9a87ff" stroke-width="26" opacity="0.28" filter="url(#glowMid)"/>
    </g>

    <!-- the void itself: black core with a gravitationally-lensed rim -->
    <circle cx="256" cy="256" r="103" fill="#7c6fff" opacity="0.55" filter="url(#glowMid)"/>
    <circle cx="256" cy="256" r="99"  fill="url(#coreGrad)"/>
    <!-- photon ring: the thin bright edge where light bends around the void -->
    <circle cx="256" cy="256" r="99" fill="none" stroke="#cabfff" stroke-width="2.4" opacity="0.95" filter="url(#glowSoft)"/>

    <!-- front of the ring: passes IN FRONT of the core (hot, bright) -->
    <g clip-path="url(#bottomHalf)">
      <ellipse cx="256" cy="256" rx="176" ry="62" fill="none" stroke="#b18cff" stroke-width="34" opacity="0.35" filter="url(#glowMid)"/>
      <ellipse cx="256" cy="256" rx="176" ry="62" fill="none" stroke="url(#ringGrad)" stroke-width="26"/>
      <!-- doppler hot-spot: the approaching side of the disk burns brighter -->
      <path d="M 92 278 A 176 62 0 0 0 250 318" fill="none" stroke="#e9f6ff" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#glowMid)"/>
    </g>

    <!-- ember: a mote of light about to cross the horizon -->
    <circle cx="404" cy="298" r="7" fill="#eae4ff" filter="url(#glowSoft)"/>
    <circle cx="404" cy="298" r="3" fill="#ffffff"/>
  </g>
</svg>
