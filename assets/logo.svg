<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cabfff"/>
      <stop offset="50%" stop-color="#8f7dff"/>
      <stop offset="100%" stop-color="#4a3bc7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f7dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8f7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tinyGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0a0a0f"/>

  <!-- soft ambient halo behind the mark -->
  <circle cx="238" cy="238" r="190" fill="url(#halo)" filter="url(#soft)"/>

  <circle cx="256" cy="256" r="150" fill="url(#disc)"/>
  <path d="M256,104 A152,152 0 0,1 256,408 A75,75 0 0,1 256,256 A75,75 0 0,0 256,104 Z" fill="#0a0a0f"/>

  <!-- a single spark at the tip where the spiral tapers into the void -->
  <circle cx="222" cy="382" r="6" fill="#e8e2ff" filter="url(#tinyGlow)"/>
</svg>
